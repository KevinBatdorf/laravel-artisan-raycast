name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Saturdays, after artisan-api's Friday rebuild of the command data
    - cron: "0 8 * * 6"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
